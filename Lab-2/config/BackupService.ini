; Конфигурация службы резервного копирования Lab2Backup.
; Файл должен лежать рядом с BackupService.exe. Служба читает его при запуске,
; после изменения файла службу нужно перезапустить.
; Строки, начинающиеся с ';' или '#', - комментарии.

[Backup]
; Директория, из которой выполняется резервное копирование (UNC, вместе с подкаталогами)
SourceDir = \\localhost\C$\BackupDemo\source

; Директория, в которой находится архив (UNC). Создаётся автоматически
ArchiveDir = \\localhost\C$\BackupDemo\backup

; Имя файла-архива
ArchiveName = backup.zip

; Период полной проверки исходной директории, секунд.
; Изменения замечаются и сразу (по уведомлениям файловой системы), периодическая
; проверка нужна на случай пропущенных уведомлений
ScanInterval = 10

[Masks]
; Маски и имена файлов, помещаемых в резервную копию, по одной в строке.
;   *  - любое количество любых символов
;   ?  - ровно один любой символ
; Маска без '\' сравнивается с именем файла в любом подкаталоге,
; маска с '\' - с путём относительно SourceDir (например folder1\*.txt)
*.docx
*.exe
file?.txt
important.txt
